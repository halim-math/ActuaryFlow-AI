[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "actuaryflow-ai"
version = "0.1.0"
description = "Human-governed LLM agent for policy RAG and actuarial decision support"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ActuaryFlow-AI contributors"}]
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "openai>=1.100",
  "httpx>=0.28",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "mypy>=1.17",
  "types-PyYAML>=6.0",
]

[project.scripts]
actuaryflow = "actuaryflow.agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/actuaryflow"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["actuaryflow"]
